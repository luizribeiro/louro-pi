[server]
address = "irc.weblounge.org"
nick = "louro"
alt_nicks = ["louro_", "louro__"]
sasl_username = "louro"
# A FIFO that louro-pi feeds from sops, in its temporary run directory.
password_file = "password"
autojoin = ["#bots", "#lounge"]

[grants]
irc.join = ["#bots", "#lounge"]
irc.send = ["#bots"]
irc.typing = ["#bots", "account:luiz"]
irc.react = ["#bots", "account:luiz"]
irc.dm.read = ["account:luiz"]
irc.dm.send = ["account:luiz"]
irc.whois = true
# For the operator; the louro-pi tool never lets the agent run quit.
irc.quit = true
